[project]
name = "ragapp"
version = "0.1.0"
description = "PDF semantic search: fastembed + Qdrant, orchestrated by Inngest on AWS Lambda"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.143.0",
    "inngest==0.5.19",
    "mangum==0.22.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "qdrant-client==1.19.1",
    "fastembed==0.9.0",
    "pypdf==6.20.1",
    "streamlit==1.65.0",
    "boto3==1.43.113",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "uvicorn==0.54.0",
    "pytest==9.1.1",
]
